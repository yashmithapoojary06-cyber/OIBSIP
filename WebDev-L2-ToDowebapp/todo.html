<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Web App</title>

    <link rel="stylesheet" href="todo.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Task Management System</h1>
        <p>Organize your tasks and stay productive</p>
    </div>

    <!-- Add Task -->
    <div class="add-task">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
        >

        <button id="addButton">
            Add Task
        </button>

    </div>

    <!-- Lists -->
    <div class="lists">

        <!-- Pending Tasks -->
        <section class="task-section">

            <div class="section-header">

                <h2>Pending Tasks</h2>

                <span class="count" id="pendingCount">
                    0 pending
                </span>

            </div>

            <div id="pendingList"></div>

        </section>

        <!-- Completed Tasks -->
        <section class="task-section">

            <div class="section-header">

                <h2>Completed Tasks</h2>

                <span class="count" id="completedCount">
                    0 completed
                </span>

            </div>

            <div id="completedList"></div>

        </section>

    </div>

</div>

<script src="todo.js"></script>

</body>
</html>
