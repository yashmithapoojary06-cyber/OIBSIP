<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 My To-Do List</h1>

        <!-- Add Task -->
        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a new task">
            <button id="addBtn">Add Task</button>
        </div>

        <!-- Pending Tasks -->
        <section class="task-section pending-section">
            <h2>📋 Pending Tasks</h2>
            <div class="count pending-count">
                <span id="pendingCount">0</span> pending
            </div>

            <hr>

            <div id="pendingTasks"></div>

            <div id="pendingEmpty" class="empty-state">
                <div class="star">★</div>
                <p>No pending tasks!</p>
                <span>You are all caught up.</span>
            </div>
        </section>

        <!-- Completed Tasks -->
        <section class="task-section completed-section">
            <h2>🎉 Completed Tasks</h2>
            <div class="count completed-count">
                <span id="completedCount">0</span> completed
            </div>

            <hr>

            <div id="completedTasks"></div>

            <div id="completedEmpty" class="empty-state">
                <div class="target">🎯</div>
                <p>No completed tasks yet.</p>
                <span>Complete a task to see it here.</span>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
